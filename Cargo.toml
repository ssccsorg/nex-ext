[workspace]
resolver = "2"
members = [
    "core",
    "storage/duckdb",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
interface-query = { git = "https://github.com/ssccsorg/nexus", package = "interface-query", branch = "main" }
nex = { git = "https://github.com/ssccsorg/nexus", package = "nex", branch = "main" }
nex-core = { git = "https://github.com/ssccsorg/nexus", package = "nex-core", branch = "main" }
nex-fih = { git = "https://github.com/ssccsorg/nexus", package = "nex-fih", branch = "main" }
