name: Deploy Gateway Workers

on:
  pull_request:
    paths:
      - "gateway/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: |
            gateway/module-hub/package-lock.json
            gateway/af-sync/package-lock.json
      - name: npm ci check
        run: ./scripts/deploy-gateway.sh --check

      - name: Typecheck af-sync
        run: |
          npm --prefix gateway/af-sync run cf-typegen
          npm --prefix gateway/af-sync run typecheck

      - name: Typecheck module-hub
        run: |
          npm --prefix gateway/module-hub run cf-typegen
          npm --prefix gateway/module-hub run typecheck

  deploy:
    # Manual only. Whether the token is set is asked in a step, because a job-level
    # condition cannot read the secrets context, and a workflow that names it there is
    # rejected as a whole and records a failed run on every push.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: |
            gateway/module-hub/package-lock.json
            gateway/af-sync/package-lock.json
      - name: Require the deploy token
        env:
          CFWORKER_EDIT: ${{ secrets.CFWORKER_EDIT }}
        run: |
          if [ -z "$CFWORKER_EDIT" ]; then
            echo "::error::CFWORKER_EDIT is not set, and a manual deploy needs it"
            exit 1
          fi
      - name: Deploy workers
        run: ./scripts/deploy-gateway.sh --token ${{ secrets.CFWORKER_EDIT }}
