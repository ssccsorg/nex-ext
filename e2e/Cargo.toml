[package]
name = "nex-ext-e2e"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "nex-ext end-to-end verification framework: proves the full Cypher to DuckDB path — parse, cold-route to ColdQuery, translate to SQL, execute against DuckDbStorage — so a chosen engine runs in the nexus network."

[dependencies]
nex-cypher = { path = "../db/cypher" }
nex-duckdb = { path = "../db/duckdb" }
nex-fih = { workspace = true }

[dev-dependencies]
tempfile = "3"
futures-executor = "0.3"
serde_json = "1"
