[package]
name = "nex-cypher"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "nex-cypher: Cypher-compatible frontend of the nex-ext storage family. Parses Cypher queries and lowers cold-eligible plans to ColdQuery, at the same hierarchy level as nex-duckdb."

[dependencies]
nex-fih = { workspace = true }
cyrs-syntax = { git = "https://github.com/phall1/cyrs", features = ["serde"] }
cyrs-ast = { git = "https://github.com/phall1/cyrs" }
cyrs-hir = { git = "https://github.com/phall1/cyrs" }
cyrs-plan = { git = "https://github.com/phall1/cyrs" }
serde = { workspace = true }
serde_json = "1"
